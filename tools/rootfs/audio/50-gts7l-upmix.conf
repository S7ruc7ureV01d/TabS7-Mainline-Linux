# Galaxy Tab S7 (gts7l): stereo -> the 4-speaker sink (51-gts7l-speakers.conf
# in WirePlumber). PipeWire converts in each client stream, so the upmix
# has to be set here, not on the sink. "simple" copies each front channel
# to its rear, so each side plays on both of its speakers. (The default,
# "psd", puts only derived surround in the rears.) Streams with as many
# channels as their device are not affected.
stream.properties = {
    channelmix.upmix = true
    channelmix.upmix-method = simple
}
