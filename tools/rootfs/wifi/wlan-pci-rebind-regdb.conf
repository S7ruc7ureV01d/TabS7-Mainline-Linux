# /etc/systemd/system/wlan-pci-rebind.service.d/regdb.conf
#
# cfg80211 is built in and asks for regulatory.db at ~2.7 s, before the
# real rootfs is mounted, so it stays on the built-in world domain. Once
# the rootfs is up (the same point where ath11k is rebound), make it load
# /lib/firmware/regulatory.db (package wireless-regdb).
[Service]
ExecStartPost=-/usr/bin/iw reg reload
