# Galaxy Tab S7 (gts7l) cameras (docs/phase4-camera-scoping.md).
# CAMSS exposes 14 raw video nodes (VFE RDI/PIX outputs). They only work
# with a media-ctl pipeline set up by hand, and would show up in apps as 14
# "Qualcomm Camera Subsystem" cameras. Hide their nodes; apps use the
# camera through libcamera (PipeWire's libcamera monitor) instead.
# Disable the nodes, not the V4L2 device: with the device disabled,
# PipeWire's libcamera monitor stops exposing the libcamera camera too
# (WirePlumber 0.5.17, PipeWire 1.6.8).
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "~v4l2_input.platform-ac6a000.camss*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
