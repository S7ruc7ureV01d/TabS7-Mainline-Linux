# Drop-in for hexagonrpcd-sdsp.service (installed by hexagonrpcd):
# serve this device's HexagonFS tree, and start after the SLPI is booted
# by slpi-start.service (its fastrpc node only appears then).
[Unit]
After=slpi-start.service systemd-udevd.service
Requires=slpi-start.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8250/Samsung/gts7l
