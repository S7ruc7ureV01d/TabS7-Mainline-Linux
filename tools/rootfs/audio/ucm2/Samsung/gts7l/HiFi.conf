# Samsung Galaxy Tab S7 LTE (gts7l): four CS35L41 speaker amps on
# PRIMARY_TDM_RX_0, each running Cirrus speaker protection on its own DSP.
# See docs/phase3-audio-scoping.md in the gts7l mainline repo.
#
# Safety: every amp must take its signal from the protection DSP (PCM
# Source = DSP, DSP1 Firmware = Protection). Gains are stock's playback
# values (mixer_paths.xml: AMP PCM Gain 17, Digital PCM Volume 817 = 0 dB);
# the volume is software (no PlaybackMixerElem), so full scale is stock's
# maximum.
#
# Channels, landscape with the camera on top:
#   1 = FL amp (0x43) bottom right    2 = FR amp (0x42) top right
#   3 = RL amp (0x41) bottom left     4 = RR amp (0x40) top left
# WirePlumber (51-gts7l-speakers.conf) labels them RR FR RL FL (front = the
# camera edge) and upmixes stereo so each side plays on both of its speakers.

SectionVerb {
	EnableSequence [
		cset "name='FL PCM Source' DSP"
		cset "name='FL DSP1 Firmware' Protection"
		cset "name='FL DSP1 Preload Switch' on"
		cset "name='FR PCM Source' DSP"
		cset "name='FR DSP1 Firmware' Protection"
		cset "name='FR DSP1 Preload Switch' on"
		cset "name='RL PCM Source' DSP"
		cset "name='RL DSP1 Firmware' Protection"
		cset "name='RL DSP1 Preload Switch' on"
		cset "name='RR PCM Source' DSP"
		cset "name='RR DSP1 Firmware' Protection"
		cset "name='RR DSP1 Preload Switch' on"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='FL PCM Source' DSP"
		cset "name='FL Digital PCM Volume' 817"
		cset "name='FL Analog PCM Volume' 17"
		cset "name='FR PCM Source' DSP"
		cset "name='FR Digital PCM Volume' 817"
		cset "name='FR Analog PCM Volume' 17"
		cset "name='RL PCM Source' DSP"
		cset "name='RL Digital PCM Volume' 817"
		cset "name='RL Analog PCM Volume' 17"
		cset "name='RR PCM Source' DSP"
		cset "name='RR Digital PCM Volume' 817"
		cset "name='RR Analog PCM Volume' 17"
	]

	DisableSequence [
		cset "name='FL Analog PCM Volume' 0"
		cset "name='FR Analog PCM Volume' 0"
		cset "name='RL Analog PCM Volume' 0"
		cset "name='RR Analog PCM Volume' 0"
	]

	Value {
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
