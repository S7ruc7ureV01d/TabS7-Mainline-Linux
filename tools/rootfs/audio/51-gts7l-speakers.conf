# WirePlumber: Galaxy Tab S7 (gts7l) speakers (docs/phase3-audio-scoping.md).
# The 4-channel UCM device's channels, landscape with the camera on top:
# 1 bottom right, 2 top right, 3 bottom left, 4 top left. Labels as the
# owner checked them in KDE's speaker test: front = top (camera edge), rear
# = bottom. Stereo left goes to 3+4, right to 1+2, since the "simple"
# upmix copies each front channel to the rear on its side.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.card_name = "Samsung-GTS7L-CS35L41-Speakers"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        # S16 like stock (and every verified test); S24 was silent
        audio.format = "S16LE"
        audio.position = [ RR, FR, RL, FL ]
        channelmix.upmix = true
        channelmix.upmix-method = simple
      }
    }
  }
  {
    # The internal mics (UCM "Mic"): S16 too. PipeWire's default S24_LE
    # recorded garbage (clipping at -8 dBFS rms), as S24 playback was silent.
    matches = [
      {
        media.class = "Audio/Source"
        alsa.card_name = "Samsung-GTS7L-CS35L41-Speakers"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
