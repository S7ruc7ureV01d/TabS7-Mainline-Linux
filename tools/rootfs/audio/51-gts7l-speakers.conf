# WirePlumber: Galaxy Tab S7 (gts7l) speakers (docs/phase3-audio-scoping.md).
# The 4-channel UCM device's channels, landscape with the camera on top:
# 1 bottom right, 2 top right, 3 bottom left, 4 top left. Label them so
# stereo's right goes to 1+2 and left to 3+4, with each front channel
# copied to its rear ("simple" upmix).
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.card_name = "Samsung-GTS7L-CS35L41-Speakers"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        # S16 like stock (and every verified test); S24 was silent
        audio.format = "S16LE"
        audio.position = [ FR, RR, FL, RL ]
        channelmix.upmix = true
        channelmix.upmix-method = simple
      }
    }
  }
]
